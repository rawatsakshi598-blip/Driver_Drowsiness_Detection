[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-drowsiness-detection"
version = "1.0.0"
description = "Production-grade real-time driver drowsiness detection (EAR/MAR + optional CNN verifier)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "rawatsakshi598-blip" }]
dependencies = [
    "opencv-python>=4.8,<5.1",
    "mediapipe>=0.10.14,<2.0",
    "tensorflow-cpu>=2.15; platform_system != 'Darwin' or platform_machine != 'arm64'",
    "flask>=3.0",
    "flask-cors>=4.0",
    "pyyaml>=6.0",
    "numpy>=1.24,<2.2",
    "scikit-learn>=1.3",
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "requests>=2.31",
    "werkzeug>=3.0",
]

[project.scripts]
drowsiness-monitor = "drowsiness.app:main"
drowsiness-server = "server:main"

[tool.setuptools]
packages = ["drowsiness", "drowsiness.detectors", "drowsiness.video", "drowsiness.alarms"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take more than 5 seconds",
]
